<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0c0a1d">
<title>월하검무</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%230c0a1d'/%3E%3Ccircle cx='8' cy='8' r='5' fill='%23ffe3a3'/%3E%3Ccircle cx='10' cy='6.5' r='4.2' fill='%230c0a1d'/%3E%3Crect x='3' y='12' width='10' height='1' fill='%237fe3ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&family=Silkscreen&display=swap">
<style>
/* 레이아웃: 16:9 픽셀 화면을 가운데 두고, 메뉴는 화면 위 덮개, 터치 패드는 화면 아래 구석 */
:root{
  --night:#0c0a1d; --ink:#ece8ff; --dim:#a39cd0; --faint:#6f68a0;
  --moon:#ffe3a3; --gold:#ffd36b; --blade:#7fe3ff; --rose:#ff6b9a; --ok:#7dffb4;
  --win:rgba(17,12,38,.95); --win2:rgba(30,22,64,.9); --line:#4a3d8a; --line2:#7a68d0;
  --r3:#8fb8ff; --r4:#c99bff; --r5:#ffd36b;
  --display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --pixel:"Silkscreen",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top,0px) max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
#app{height:100%;display:flex;flex-direction:column}
#wrap{flex:1;min-height:0;display:grid;place-items:center}
#frame{position:relative;width:320px;height:180px;container-type:size;overflow:hidden;background:#100c28;border-radius:4px}
#screen,#hud{position:absolute;inset:0;width:100%;height:100%;display:block}
#screen{image-rendering:pixelated;image-rendering:crisp-edges}
#hud{pointer-events:none}
body.touch[data-scene] #wrap{padding-bottom:0}
@media (orientation:portrait){ body.touch #app{padding-bottom:230px} }

/* 상단 메뉴 버튼 */
#menuBtn{position:absolute;top:1.6cqh;left:50%;transform:translateX(-50%);font:400 clamp(11px,3.4cqh,17px) var(--display);color:var(--ink);background:rgba(16,11,34,.72);border:1px solid var(--line2);border-radius:.5em;padding:.25em .9em;cursor:pointer;z-index:3}
#menuBtn:focus-visible{outline:2px solid var(--blade);outline-offset:2px}
body[data-scene="title"] #menuBtn{display:none}

/* 패널 공통 */
#ui{position:absolute;inset:0;z-index:5}
.panel{position:absolute;inset:0;display:flex;flex-direction:column;gap:2cqh;padding:3cqh 3cqw;background:rgba(10,7,26,.8);font-size:clamp(11px,3.6cqh,19px);line-height:1.45;overflow:hidden;animation:pin .18s ease-out}
.panel.title{background:linear-gradient(90deg,rgba(10,7,26,.86) 0%,rgba(10,7,26,.5) 50%,rgba(10,7,26,.05) 75%);justify-content:center;gap:3cqh;padding-left:6cqw}
.panel.center{align-items:center;justify-content:center}
.panel.dark{background:rgba(6,4,16,.9)}
@keyframes pin{from{opacity:0}to{opacity:1}}
.win{position:relative;background:var(--win);border:1px solid var(--line);box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.5);border-radius:3px;min-width:0;min-height:0}
.win::before,.win::after{content:"";position:absolute;width:.45em;height:.45em;background:var(--gold);transform:rotate(45deg);top:-.25em;left:-.25em;box-shadow:0 0 0 1px #2a1d50}
.win::after{left:auto;right:-.25em}
.pad{padding:2.4cqh 2.4cqw}
.scroll{overflow:auto;overscroll-behavior:contain;touch-action:pan-y}
.cols{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:2cqw}
.cols>.win{overflow:auto;touch-action:pan-y}
.cols.g{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.row{display:flex;gap:1.2cqw;flex-wrap:wrap;margin-top:1.6cqh}
.note{color:var(--dim);font-size:.82em;margin:.4em 0}
.eyebrow{font:400 .72em var(--pixel);letter-spacing:.12em;color:var(--blade);text-transform:uppercase}
.glabel{font:400 .8em var(--display);color:var(--dim);margin:1.4cqh 0 .8cqh;display:flex;gap:.6em;align-items:center}
.coin{width:1em;height:1em;image-rendering:pixelated;vertical-align:-.12em;margin-right:.25em}
.stars{font-size:.72em;letter-spacing:-.05em}
.stars.r3{color:var(--r3)}.stars.r4{color:var(--r4)}.stars.r5{color:var(--r5)}
.stars.r6{background:linear-gradient(90deg,#ff9be8,#b79bff,#7fe3ff,#ffe3a3);-webkit-background-clip:text;background-clip:text;color:transparent}
.spr{image-rendering:pixelated;width:4em;height:auto;display:block}
.spr.big{width:5.6em}.spr.six{width:6.4em;filter:drop-shadow(0 0 .3em rgba(255,155,232,.6))}.spr.huge{width:min(16em,48cqh)}
.spr.locked,.locked .spr{filter:brightness(0) drop-shadow(0 0 1px #6f68a0)}
.face{image-rendering:pixelated;width:2.4em;height:2.4em;border:1px solid var(--line2);background:#1d1540;border-radius:2px;flex:none}
small{font-size:.75em;color:var(--dim)}

/* 버튼 */
.btn{font:400 1em var(--display);color:var(--ink);background:linear-gradient(#2a2058,#1d1642);border:1px solid var(--line2);border-radius:3px;padding:.45em 1.1em;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.8em;min-height:2.3em}
.btn:hover:not([disabled]){background:linear-gradient(#352a70,#251c54)}
.btn.main{background:linear-gradient(#5a46b8,#3d2f8a);border-color:#a796ff;color:#fff}
.btn.danger{border-color:#c0506e}
.btn.sm{font-size:.85em;padding:.3em .8em;min-height:2em}
.btn[disabled]{opacity:.4;cursor:default}
.nav:focus-visible,.nav:focus{outline:2px solid var(--gold);outline-offset:1px}
.cost{display:inline-flex;align-items:center;font:400 .8em var(--pixel);color:#bff0ff}
.pill{display:inline-flex;align-items:center;background:var(--win2);border:1px solid var(--line);border-radius:999px;padding:.1em .7em;font:400 .78em var(--pixel)}
.pright{display:flex;gap:.6em;align-items:center;justify-content:flex-end;flex-wrap:wrap}

/* 머리줄 */
.phead{display:flex;align-items:center;gap:1.4cqw;flex:none}
.phead h2{font:400 1.5em var(--display);margin:0;color:var(--moon);flex:1;white-space:nowrap}
.back{font:400 .9em var(--display);color:var(--moon);background:rgba(16,11,34,.8);border:1px solid #8a6a2a;border-radius:3px;padding:.3em .8em;cursor:pointer}

/* 타이틀 */
.title-art{display:flex;flex-direction:column;gap:.6cqh}
.logo{font:400 clamp(40px,20cqh,110px) var(--display);margin:0;line-height:.95;color:var(--moon);letter-spacing:.02em;text-shadow:0 0 .4em rgba(255,227,163,.35),.05em .05em 0 #3a2470}
.tag{margin:0;color:var(--blade);font:400 1.05em var(--display);letter-spacing:.2em}
.menu-box{display:flex;flex-direction:column;gap:1.2cqh;padding:2.4cqh 2cqw;width:min(19em,40cqw)}
.menu-box .btn{width:100%}
.mt{font:400 1.2em var(--display);color:var(--moon);margin:0 0 .4em;text-align:center}
.foot{position:absolute;left:6cqw;right:3cqw;bottom:2.4cqh;display:flex;justify-content:space-between;gap:1em;font-size:.72em;color:var(--faint);flex-wrap:wrap}
.panel.center .menu-box{width:min(18em,46cqw);max-height:94cqh;overflow:auto}

/* 확인창 */
.confirm{padding:3cqh 3cqw;max-width:min(30em,80cqw);text-align:center}
.confirm p{margin:0 0 .6em}.confirm .row{justify-content:center}

/* 목록 행 */
.list{padding:1.4cqh 1.4cqw;display:flex;flex-direction:column;gap:.7cqh}
.srow{display:flex;justify-content:space-between;align-items:center;gap:1em;width:100%;font:400 .95em var(--display);color:var(--ink);background:rgba(36,27,78,.6);border:1px solid var(--line);border-radius:2px;padding:.45em .8em;cursor:pointer;text-align:left}
.srow.on{background:linear-gradient(90deg,#4a3aa0,#2e2470);border-color:#a796ff}
.srow.danger{color:#ffb3c6}
.srow.hl{border-color:var(--gold);color:var(--moon)}
.srow[disabled]{opacity:.45;cursor:default}
.sval{display:flex;align-items:center;gap:.5em}
.sval i{font-style:normal;color:var(--dim);padding:0 .3em}
.sval b{font-weight:400;min-width:4.5em;text-align:center}
.sdesc{padding:2.4cqh 2.4cqw}.sdesc h3{font:400 1.25em var(--display);margin:0 0 .6em;color:var(--moon)}
.sdesc .bar{height:.7em;background:#1a1236;border:1px solid var(--line);margin-top:2em}.sdesc .bar i{display:block;height:100%;background:#a796ff}
.sdesc .big{display:block;text-align:center;font:400 1.3em var(--pixel);color:var(--gold);margin-top:.4em}
.code{width:100%;height:5.5em;font:400 .7em ui-monospace,monospace;background:#0d0920;color:var(--ink);border:1px solid var(--line);padding:.6em;resize:none;user-select:text;-webkit-user-select:text}
.code1{font:400 1.1em var(--pixel);width:100%;background:#0d0920;color:var(--ink);border:1px solid var(--line2);padding:.5em;text-transform:uppercase;user-select:text}
.narrow{max-width:24em;align-self:center;width:100%}
.msg{color:var(--gold);min-height:1.4em;margin:.6em 0 0}

/* 탭 */
.tabs{display:flex;gap:.6cqw;margin-bottom:1.2cqh;flex-wrap:wrap}
.tabs.top{flex:none;margin:0}
.tab{font:400 .9em var(--display);color:var(--dim);background:rgba(36,27,78,.5);border:1px solid var(--line);padding:.35em 1em;cursor:pointer;border-radius:2px}
.tab.on{color:#fff;background:linear-gradient(#5a46b8,#3d2f8a);border-color:#a796ff}
.ktable{width:100%;border-collapse:collapse;font-size:.92em}
.ktable th{font:400 .85em var(--display);color:var(--dim);text-align:left;padding:.3em .6em}
.ktable td{padding:.32em .6em;border-top:1px solid rgba(74,61,138,.4)}
.ktable td:last-child{color:var(--gold);font-family:var(--display)}
.tips{margin:0;padding:0 1.4cqw 1.4cqh}.tips dt{font:400 1.05em var(--display);color:var(--gold);margin-top:.7em}.tips dd{margin:0;font-size:.9em}

/* 기록·키값 */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.6cqh 2cqw;margin:0 0 1em}
.stats dt{font-size:.8em;color:var(--dim)}.stats dd{margin:0;font:400 1.7em var(--pixel);color:var(--moon)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1cqh 1.6cqw;margin:.6em 0}
.kv dt{font-size:.75em;color:var(--dim)}.kv dd{margin:0;font:400 1.05em var(--display)}
.kv dd.ok{color:var(--ok)}.kv dd.warn{color:#ffb38a}
.clr{font:400 .7em var(--display);font-style:normal;color:#1a1238;background:var(--ok);padding:.05em .45em;border-radius:2px}
.bosstag{font:400 .7em var(--pixel);font-style:normal;color:#fff;background:#c0304e;padding:.05em .45em;border-radius:2px}

/* 소환 */
.banner{display:grid;grid-template-rows:1fr auto;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#3a2a7a,#140e30 70%)}
.bimg{display:flex;justify-content:center;align-items:center;gap:0;padding-top:2cqh;min-height:0}
.bimg .spr{width:22%;max-width:9em;margin:0 -2%}
.bimg .spr.six{width:34%;max-width:14em;margin:0 -1%}
.btext{padding:1.4cqh 2cqw;background:linear-gradient(transparent,rgba(10,7,26,.9) 30%)}
.btext h3{font:400 1.4em var(--display);margin:.1em 0;color:var(--moon)}.btext p{margin:.2em 0;font-size:.82em}
.pity b{color:var(--gold);font-family:var(--pixel)}
.gside{padding:2.4cqh 2cqw;display:flex;flex-direction:column;gap:1.4cqh;justify-content:center}
.gside .btn{justify-content:space-between;width:100%}
.gres{display:flex;flex-direction:column;align-items:center;gap:2cqh;width:100%;max-height:100%}
.gres.gold{background:radial-gradient(ellipse at 50% 40%,rgba(255,211,107,.25),transparent 60%)}
.gres.rainbow{background:radial-gradient(ellipse at 50% 40%,rgba(255,155,232,.3),rgba(127,227,255,.12) 40%,transparent 65%)}
.gres.violet{background:radial-gradient(ellipse at 50% 40%,rgba(201,155,255,.2),transparent 60%)}
.cards{display:grid;gap:1.2cqh 1.2cqw;grid-template-columns:repeat(5,minmax(0,1fr));width:min(100%,46em)}
.cards.n1{grid-template-columns:minmax(0,10em)}
.gcard{display:flex;flex-direction:column;align-items:center;gap:.1em;padding:1cqh .4em;background:linear-gradient(#241a52,#120c2c);border:1px solid var(--line);border-radius:3px;opacity:0;animation:pop .35s ease-out var(--d) forwards;font-size:.85em;text-align:center}
.gcard.r4{border-color:var(--r4);box-shadow:0 0 .8em rgba(201,155,255,.35)}
.gcard.r6{border-color:#ff9be8;box-shadow:0 0 1.4em rgba(255,155,232,.6),0 0 .4em rgba(127,227,255,.5);background:linear-gradient(#4a2266,#1c142c)}
.gcard.r5{border-color:var(--r5);box-shadow:0 0 1.2em rgba(255,211,107,.5);background:linear-gradient(#4a3a1a,#1c142c)}
.gcard .spr{width:70%;max-width:4.6em}
.gcard b{font:400 1em var(--display)}
.gtag{font:400 .72em var(--display);padding:.05em .5em;border-radius:2px;background:#2a2058}
.gtag.new{background:var(--rose);color:#fff}.gtag.aw{background:#3d2f8a}.gtag.silver{background:#3a4058}
@keyframes pop{0%{opacity:0;transform:translateY(.6em) scale(.8)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:none}}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5em,1fr));gap:1cqh 1cqw}
.rcard{display:flex;align-items:center;gap:.6em;padding:.4em .6em;border:1px solid var(--line);background:rgba(36,27,78,.45)}
.rcard.r6{border-color:#ff9be8}.rcard.r5{border-color:rgba(255,211,107,.6)}.rcard.r4{border-color:rgba(201,155,255,.55)}
.rcard .spr{width:2.6em}.rcard b{display:block;font:400 1em var(--display)}.rcard span{font:400 .8em var(--pixel);color:var(--blade)}

/* 영웅 카드 */
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(6.4em,1fr));gap:1.2cqh 1cqw}
.hcard{display:flex;flex-direction:column;align-items:center;gap:.05em;padding:.6em .3em;background:linear-gradient(#211849,#140e30);border:1px solid var(--line);border-radius:3px;color:var(--ink);cursor:pointer;font-size:.9em}
.hcard.r5{border-color:rgba(255,211,107,.7)}.hcard.r6{border-color:#ff9be8;box-shadow:0 0 .6em rgba(255,155,232,.4);background:linear-gradient(#3a1f5a,#140e30)}.hcard.r4{border-color:rgba(201,155,255,.6)}
.hcard b{font:400 1em var(--display)}.hcard .lv{font-size:.72em;color:var(--dim)}
.hcard.inparty{background:linear-gradient(#3a2d80,#1d1548)}
.hero-show{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1cqh;background:radial-gradient(ellipse at 50% 45%,#30246a,#120c2c 70%)}
.hero-show.r6{background:radial-gradient(ellipse at 50% 45%,#4a2266,#120c2c 70%)}
.hero-show.r5{background:radial-gradient(ellipse at 50% 45%,#5a4420,#120c2c 70%)}
.hname{text-align:center}.hname small{display:block}.hname b{display:block;font:400 1.8em var(--display);color:var(--moon)}
.skill{display:flex;gap:.8em;margin:.8em 0;align-items:flex-start}
.skill img{width:2.4em;height:2.4em;image-rendering:pixelated;background:#0d0920;border:1px solid var(--line2);padding:.2em;flex:none}
.skill b{font:400 1.05em var(--display);color:var(--gold)}.skill span{font-size:.75em;color:var(--dim);margin-left:.6em}.skill p{margin:.1em 0 0;font-size:.85em}
.flavor{font-size:.85em;color:var(--dim);border-left:2px solid var(--line2);padding-left:.8em}
.pslots{display:grid;grid-template-columns:1fr 1fr;gap:2cqw}
.pslot{display:flex;flex-direction:column;align-items:center;gap:.1em;padding:1cqh;background:rgba(36,27,78,.5);border:1px dashed var(--line2);color:var(--ink);cursor:pointer;border-radius:3px}
.pslot.on{border-style:solid;border-color:var(--gold);background:rgba(74,58,160,.45)}
.pslot b{font:400 1.2em var(--display)}.pslot .lv{font-size:.75em;color:var(--dim)}.empty{color:var(--faint)}
.plabel{font:400 .8em var(--display);color:var(--gold);align-self:flex-start}
.trow{display:flex;align-items:center;gap:1em;padding:.6em .4em;border-top:1px solid rgba(74,61,138,.45)}
.tinfo{flex:1;min-width:0}.tinfo b{font:400 1.05em var(--display)}.tinfo span{display:block;font-size:.8em;color:var(--dim)}

/* 출정 */
.sinfo h3,.endless h3{font:400 1.4em var(--display);margin:0;color:var(--moon)}
.enemies{display:flex;flex-wrap:wrap;gap:.4em;margin:0}
.enemies span{font-size:.82em;padding:.05em .6em;border:1px solid var(--line);border-radius:2px}
.enemies .elite{border-color:#ffb347;color:#ffcf8a}.enemies .boss{border-color:#ff4d6d;color:#ffb3c6}
.rew{margin:0;font-family:var(--display)}

/* 결과 */
.result{padding:3cqh 4cqw;text-align:center;min-width:min(30em,80cqw)}
.result h2{font:400 2.6em var(--display);margin:.1em 0;color:var(--moon)}
.result.lose h2{color:#ffb3c6}.result .kv{text-align:left}.result .row{justify-content:center}

/* 알림 */
#toast{position:absolute;left:50%;top:40cqh;transform:translateX(-50%);z-index:8;background:rgba(16,11,34,.92);border:1px solid var(--gold);color:var(--moon);font:400 clamp(11px,3.4cqh,17px) var(--display);padding:.4em 1.2em;border-radius:3px;opacity:0;pointer-events:none;white-space:nowrap;max-width:94cqw;overflow:hidden;text-overflow:ellipsis}
#toast.show{animation:toast 2.8s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-.4em)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

/* 좁은 화면 */
@container (max-width:560px){
  .cols,.cols.g{grid-template-columns:1fr;grid-template-rows:none;overflow:auto;touch-action:pan-y}
  .stats,.kv{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cards{grid-template-columns:repeat(5,minmax(0,1fr));font-size:.8em}
}

/* 터치 패드 */
#pad{display:none}
body.touch #pad{display:block;position:fixed;left:0;right:0;bottom:0;height:230px;pointer-events:none;z-index:10;padding:0 max(14px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(14px,env(safe-area-inset-left,0px))}
body.touch[data-scene="title"] #pad,body.touch.menuopen #pad{display:none}
#pad .zone{pointer-events:auto;position:absolute;left:0;bottom:0;width:45%;height:70%;touch-action:none}
#pad .stick{pointer-events:auto;position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:180px;height:180px;border-radius:50%;background:rgba(30,22,64,.35);border:2px solid rgba(190,180,255,.32);touch-action:none;transform-origin:left bottom}
#pad .stick.float{background:rgba(30,22,64,.5);border-color:rgba(190,180,255,.55)}
#pad .knob{position:absolute;left:50%;top:50%;width:78px;height:78px;margin:-39px 0 0 -39px;border-radius:50%;background:rgba(190,180,255,.3);border:2px solid rgba(220,210,255,.6);pointer-events:none}
body.padedit #pad{display:block!important;z-index:30;background:rgba(6,4,16,.35)}
body.padedit #pad .zone{display:none}
body.padedit #pad [data-id]{outline:2px dashed var(--gold);outline-offset:3px;cursor:grab}
body.padedit #pad [data-id].drag{outline-color:var(--blade)}
#padbar{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:40;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;max-width:calc(100% - 24px);background:rgba(16,11,34,.95);border:1px solid var(--line2);border-radius:6px;padding:8px 12px;font:400 15px var(--display);color:var(--ink)}
#padbar p{margin:0;width:100%;text-align:center;color:var(--moon)}
#padbar .grp{display:flex;align-items:center;gap:6px}
#padbar button{font:400 15px var(--display);color:var(--ink);background:#2a2058;border:1px solid var(--line2);border-radius:4px;min-width:38px;min-height:36px;padding:0 10px;cursor:pointer}
#padbar button.main{background:#4a3aa0;border-color:#a796ff}
#padbar b{font:400 13px var(--pixel);min-width:44px;text-align:center;color:var(--gold)}
#pad .acts{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:236px;height:206px}
.pb{pointer-events:auto;position:absolute;width:56px;height:56px;border-radius:50%;background:rgba(30,22,64,.5);border:2px solid rgba(190,180,255,.4);color:var(--ink);font:400 15px var(--display);display:grid;place-items:center;padding:0;touch-action:none}
.pb.on{background:rgba(127,227,255,.35)}
.pb.atk{width:76px;height:76px;right:0;bottom:30px;font-size:19px;border-color:rgba(255,107,154,.7)}
.pb.jmp{right:82px;bottom:0;border-color:rgba(127,190,255,.7)}
.pb.dsh{right:146px;bottom:0;border-color:rgba(190,170,255,.6)}
.pb.s1{right:92px;bottom:64px;border-color:rgba(255,211,107,.7);color:var(--gold)}
.pb.s2{right:50px;bottom:120px;border-color:rgba(255,211,107,.7);color:var(--gold)}
.pb.tag{right:150px;bottom:92px;width:48px;height:48px;font-size:13px;border-color:rgba(125,255,180,.6)}
.pb.int{right:0;bottom:142px;width:48px;height:48px;font-size:13px}
@media (orientation:landscape){ body.touch #pad{height:100%} }
@media (prefers-reduced-motion:reduce){.panel,.gcard,#toast.show{animation-duration:.01s}}
</style>
</head>
<body data-scene="title">
<div id="app">
  <div id="wrap">
    <div id="frame">
      <canvas id="screen" width="320" height="180" aria-label="월하검무 게임 화면"></canvas>
      <canvas id="hud"></canvas>
      <button id="menuBtn" type="button">Ⅱ 메뉴</button>
      <div id="ui" hidden></div>
      <div id="toast" role="status"></div>
    </div>
  </div>
</div>
<div id="padbar" hidden>
  <p>조이스틱과 버튼을 끌어서 옮기세요</p>
  <span class="grp">조이스틱 <button data-pe="st-" aria-label="조이스틱 작게">−</button><b data-v="st">100%</b><button data-pe="st+" aria-label="조이스틱 크게">+</button></span>
  <span class="grp">버튼 <button data-pe="bt-" aria-label="버튼 작게">−</button><b data-v="bt">100%</b><button data-pe="bt+" aria-label="버튼 크게">+</button></span>
  <button data-pe="reset">처음 배치로</button>
  <button data-pe="done" class="main">완료</button>
</div>
<div id="pad" aria-hidden="true">
  <div class="zone"></div>
  <div class="stick" data-id="stick"><div class="knob"></div></div>
  <div class="acts">
    <button class="pb atk" data-id="atk" data-act="attack">공격</button>
    <button class="pb jmp" data-id="jmp" data-act="jump">점프</button>
    <button class="pb dsh" data-id="dsh" data-act="dash">대시</button>
    <button class="pb s1" data-id="s1" data-act="skill1">스킬1</button>
    <button class="pb s2" data-id="s2" data-act="skill2">스킬2</button>
    <button class="pb tag" data-id="tag" data-act="tag">교대</button>
    <button class="pb int" data-id="int" data-act="interact">상호</button>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
