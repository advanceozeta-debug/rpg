<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>월하검무</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&family=Silkscreen&display=swap">
<style>
/* Layout: one full-screen stage — a 16:9 pixel canvas letterboxed in moonlit night, menus as overlays, touch pad over the bottom corners (below the screen in portrait) */
:root{
  --night:#0c0a1d;
  --ink:#ece8ff;
  --dim:#9790c4;
  --moon:#ffe3a3;
  --blade:#7fe3ff;
  --rose:#ff6b9a;
  --veil:rgba(12,10,29,.78);
  --line:rgba(190,180,255,.28);
  --display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --pixel:"Silkscreen",ui-monospace,"SFMono-Regular",monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  background:var(--night);color:var(--ink);font-family:var(--body);
  overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
#stage{position:relative;height:100%;display:flex;flex-direction:column}
#wrap{flex:1;min-height:0;display:grid;place-items:center}
#frame{position:relative;width:320px;height:180px;container-type:size;overflow:hidden;border-radius:6px;box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.5)}
#game{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;background:#100c28}

.overlay{position:absolute;inset:0;display:flex;align-items:center;padding:0 6cqw;background:linear-gradient(90deg,var(--veil) 0%,rgba(12,10,29,.55) 48%,rgba(12,10,29,0) 72%);overflow:auto}
.panel{display:flex;flex-direction:column;gap:2.4cqh;max-width:52cqw}
.eyebrow{font-family:var(--pixel);font-size:clamp(9px,3.2cqh,15px);letter-spacing:.12em;color:var(--blade);text-transform:uppercase}
.logo{font-family:var(--display);font-weight:400;font-size:clamp(34px,19cqh,96px);line-height:.95;letter-spacing:.02em;margin:0;color:var(--moon);text-shadow:0 0 .5em rgba(255,227,163,.35),.05em .05em 0 #3a2470;text-wrap:balance}
.lede{margin:0;font-size:clamp(12px,4.2cqh,19px);line-height:1.55;color:var(--ink);max-width:34ch}
.lede b{color:var(--blade);font-weight:400}
.cta{align-self:flex-start;font-family:var(--display);font-size:clamp(16px,6cqh,28px);color:#1a1238;background:var(--moon);border:0;border-radius:999px;padding:.35em 1.3em;cursor:pointer;box-shadow:0 .15em 0 #b88f3c;transition:transform .12s}
.cta:hover{transform:translateY(-2px)}
.cta:focus-visible{outline:2px solid var(--blade);outline-offset:3px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:.35em 1em;font-size:clamp(11px,3.4cqh,15px);color:var(--dim);margin:0}
.keys dt{font-family:var(--pixel);color:var(--ink);letter-spacing:.04em}
.keys dd{margin:0}
.touchnote{display:none;font-size:clamp(11px,3.4cqh,15px);color:var(--dim);margin:0}
body.touch .keys{display:none}
body.touch .touchnote{display:block}
.stats{display:grid;grid-template-columns:repeat(3,auto);gap:.2em 1.6em;margin:0;justify-content:start}
.stats div{display:flex;flex-direction:column}
.stats dt{font-size:clamp(10px,3.2cqh,14px);color:var(--dim)}
.stats dd{margin:0;font-family:var(--pixel);font-size:clamp(16px,7cqh,32px);color:var(--moon);font-variant-numeric:tabular-nums}
.over-title{font-family:var(--display);font-weight:400;font-size:clamp(26px,13cqh,64px);margin:0;color:var(--rose);line-height:1}

#pad{display:none}
body.touch #pad{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-block:10px 14px}
@media (orientation:landscape){
  body.touch #pad{position:absolute;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);pointer-events:none;padding-block:0 10px}
  body.touch #pad button{pointer-events:auto}
}
.dpad{display:flex;gap:10px}
.acts{display:grid;grid-template-columns:auto auto;gap:10px;align-items:end}
.pb{
  width:62px;height:62px;border-radius:50%;
  background:rgba(34,26,78,.55);border:2px solid var(--line);color:var(--ink);
  font-family:var(--display);font-size:17px;touch-action:none;-webkit-tap-highlight-color:transparent;
  display:grid;place-items:center;padding:0;backdrop-filter:blur(2px);
}
.pb.dir{width:70px;border-radius:18px}
.pb.big{width:78px;height:78px;font-size:21px;border-color:rgba(255,227,163,.55)}
.pb.sk{border-color:rgba(127,227,255,.6);color:var(--blade)}
.pb.on{background:rgba(127,227,255,.32)}
.pb svg{width:22px;height:22px;fill:currentColor}
@media (prefers-reduced-motion:reduce){.cta{transition:none}}
</style>
</head>
<body>

<div id="stage">
  <div id="wrap">
    <div id="frame">
      <canvas id="game" width="320" height="180" aria-label="월하검무 게임 화면"></canvas>

      <div class="overlay" id="title">
        <div class="panel">
          <span class="eyebrow">Action RPG · Prototype 01</span>
          <h1 class="logo">월하검무</h1>
          <p class="lede">달빛 검사 <b>리아</b>가 밤마다 몰려오는 그림자 무리를 베어 냅니다. 웨이브를 버티며 레벨을 올려 보세요.</p>
          <button class="cta" id="startBtn" type="button">시작하기</button>
          <dl class="keys">
            <dt>← →</dt><dd>이동</dd>
            <dt>X · ↑</dt><dd>점프 (공중에서 한 번 더)</dd>
            <dt>Z</dt><dd>베기, 연타하면 3연격</dd>
            <dt>C</dt><dd>대시 (잠깐 무적)</dd>
            <dt>V</dt><dd>월광참 (MP 25)</dd>
          </dl>
          <p class="touchnote">화면 아래 버튼으로 조작해요. 가로로 돌리면 더 크게 보여요.</p>
        </div>
      </div>

      <div class="overlay" id="over" hidden>
        <div class="panel">
          <span class="eyebrow">Game Over</span>
          <h2 class="over-title">리아가 쓰러졌어요</h2>
          <dl class="stats">
            <div><dt>도달 웨이브</dt><dd id="sWave">1</dd></div>
            <div><dt>레벨</dt><dd id="sLv">1</dd></div>
            <div><dt>처치</dt><dd id="sKo">0</dd></div>
          </dl>
          <button class="cta" id="againBtn" type="button">다시 하기</button>
        </div>
      </div>
    </div>
  </div>

  <div id="pad">
    <div class="dpad">
      <button class="pb dir" data-act="left" aria-label="왼쪽"><svg viewBox="0 0 10 10"><path d="M7 1 2 5l5 4z"/></svg></button>
      <button class="pb dir" data-act="right" aria-label="오른쪽"><svg viewBox="0 0 10 10"><path d="M3 1l5 4-5 4z"/></svg></button>
    </div>
    <div class="acts">
      <button class="pb sk" data-act="skill">월광</button>
      <button class="pb" data-act="dash">대시</button>
      <button class="pb" data-act="jump">점프</button>
      <button class="pb big" data-act="attack">베기</button>
    </div>
  </div>
</div>

<script>
(()=>{
const W=320,H=180,WORLD=640,GROUND=152;
const cv=document.getElementById('game'),g=cv.getContext('2d');
g.imageSmoothingEnabled=false;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const PF='8px Silkscreen, monospace';

/* ---------- utils ---------- */
function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=Math.random;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function mk(w,h){const k=document.createElement('canvas');k.width=w;k.height=h;return k}
let c=g;
function R(x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h)}
function line(x0,y0,a,len,col,th=1){const ca=Math.cos(a),sa=Math.sin(a);for(let i=0;i<len;i++){R(Math.round(x0+ca*i),Math.round(y0+sa*i),th,th,col)}}

/* ---------- layout ---------- */
const wrap=document.getElementById('wrap'),frame=document.getElementById('frame');
function fit(){const r=wrap.getBoundingClientRect();let w=Math.min(r.width,r.height*16/9);w=Math.max(160,Math.floor(w));frame.style.width=w+'px';frame.style.height=Math.floor(w*9/16)+'px'}
new ResizeObserver(fit).observe(wrap);fit();
if(matchMedia('(pointer:coarse)').matches||'ontouchstart' in window)document.body.classList.add('touch');
addEventListener('touchstart',()=>document.body.classList.add('touch'),{once:true,passive:true});

/* ---------- input ---------- */
const keys={left:0,right:0,jump:0,attack:0,dash:0,skill:0};let pressed={};
function press(a){if(!keys[a])pressed[a]=1;keys[a]=1}
function release(a){keys[a]=0}
const KM={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyX:'jump',Space:'jump',KeyW:'jump',KeyK:'jump',KeyZ:'attack',KeyJ:'attack',KeyC:'dash',KeyL:'dash',ShiftLeft:'dash',KeyV:'skill',KeyU:'skill'};
addEventListener('keydown',e=>{
  if(e.code==='Enter'&&state!=='play'){begin();e.preventDefault();return}
  const a=KM[e.code];if(a){press(a);if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault()}
});
addEventListener('keyup',e=>{const a=KM[e.code];if(a)release(a)});
addEventListener('blur',()=>{for(const k in keys)keys[k]=0});
document.querySelectorAll('#pad [data-act]').forEach(b=>{
  const a=b.dataset.act;
  b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}press(a);b.classList.add('on')});
  const up=()=>{release(a);b.classList.remove('on')};
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
  b.addEventListener('contextmenu',e=>e.preventDefault());
});

/* ---------- palette ---------- */
const OL='#120c22';
const C={hair:'#e9edfb',hairS:'#aab2dc',hairD:'#737cae',skin:'#fbe1d0',skinS:'#eab59f',eye:'#3cc8f2',eyeD:'#1d63a0',coat:'#2e3f7d',coatS:'#1e2859',white:'#f3f2fb',gold:'#f3c75b',rib:'#5fdcff',boot:'#2a2140',blade:'#e4f7ff',edge:'#7fe3ff',blush:'#f59bb0'};

/* ---------- prerendered backdrop ---------- */
const SKY=mk(W,H),FAR=mk(Math.ceil((WORLD-W)*.2)+W,H),MID=mk(Math.ceil((WORLD-W)*.5)+W,H),FG=mk(WORLD,H);
const stars=[];
(function build(){
  const r=mulberry32(11);
  let x=SKY.getContext('2d');
  const bands=['#100c28','#151039','#1c1548','#251b58','#322268','#432b78','#5a3486','#713e90'];
  const bh=16;
  bands.forEach((col,i)=>{x.fillStyle=col;x.fillRect(0,i*bh,W,bh);if(i<bands.length-1){x.fillStyle=bands[i+1];for(let p=0;p<W;p+=2){x.fillRect(p+(i%2),i*bh+bh-2,1,1);x.fillRect(p,i*bh+bh-1,1,1)}}});
  x.fillStyle=bands[bands.length-1];x.fillRect(0,bands.length*bh,W,H);
  for(let i=0;i<90;i++){const sx=r()*W|0,sy=r()*110|0;x.fillStyle=['#ffffff','#cfd6ff','#ffe8b8','#9e95d6'][r()*4|0];x.fillRect(sx,sy,1,1);if(r()<.12)stars.push({x:sx,y:sy,p:r()*6})}
  // moon
  const mx=248,my=44,mr=20;
  for(let py=my-mr-14;py<=my+mr+14;py++)for(let px=mx-mr-14;px<=mx+mr+14;px++){
    const d=Math.hypot(px-mx,py-my);
    if(d<=mr){
      let col=d>mr-1.6?'#ffd786':'#fff2c9';
      if(Math.hypot(px-(mx-7),py-(my-4))<3.4||Math.hypot(px-(mx+5),py-(my+7))<4.2||Math.hypot(px-(mx+8),py-(my-8))<2.2)col='#f4dfa9';
      if(px-mx+py-my>mr*.9)col=d>mr-1.6?'#e9c071':'#f6e3b2';
      x.fillStyle=col;x.fillRect(px,py,1,1);
    }else if(d<mr+5&&(px+py)%2===0){x.fillStyle='rgba(255,227,163,.22)';x.fillRect(px,py,1,1)}
    else if(d<mr+13&&px%2===0&&py%2===0){x.fillStyle='rgba(255,227,163,.1)';x.fillRect(px,py,1,1)}
  }
  // far ridge + castle
  x=FAR.getContext('2d');
  const tops=[];
  for(let i=0;i<FAR.width;i++){const t=Math.round(104-15*Math.abs(Math.sin(i*.019+1.2))-9*Math.abs(Math.sin(i*.052+.3))+(r()<.3?1:0));tops.push(t);x.fillStyle='#2a2062';x.fillRect(i,t,1,H-t);x.fillStyle='#43378c';x.fillRect(i,t,1,1)}
  const cx=210,cb=tops[210]+2;
  x.fillStyle='#231a55';
  [[0,0,22,10],[3,-6,16,6],[6,-11,10,5],[9,-15,4,4]].forEach(([a,b,w,h])=>x.fillRect(cx+a,cb-10+b,w,h));
  [[-3,-4,28,1],[1,-10,20,1],[4,-15,14,1]].forEach(([a,b,w])=>{x.fillStyle='#3a2f7c';x.fillRect(cx+a,cb-10+b,w,1)});
  x.fillStyle='#ffd27a';[[5,-6],[10,-6],[15,-6],[8,-12],[13,-12],[4,-1],[17,-1]].forEach(([a,b])=>x.fillRect(cx+a,cb-10+b+4,1,2));
  // mid hills + cedars
  x=MID.getContext('2d');
  for(let i=0;i<MID.width;i++){const t=Math.round(130-9*Math.sin(i*.024)-5*Math.sin(i*.071+2));x.fillStyle='#1b1544';x.fillRect(i,t,1,H-t)}
  for(let tx=4;tx<MID.width;tx+=10+(r()*22|0)){
    const base=Math.round(132-9*Math.sin(tx*.024)-5*Math.sin(tx*.071+2)),hgt=22+(r()*20|0);
    for(let yy=0;yy<hgt;yy++){const k=yy/hgt;const seg=(yy%7)/7;const w=Math.max(1,Math.round((k*.9+.1)*(5+seg*4)));x.fillStyle='#140f36';x.fillRect(tx-w,base-hgt+yy,w*2+1,1);x.fillStyle='#2b2266';x.fillRect(tx+w,base-hgt+yy,1,1)}
    x.fillStyle='#140f36';x.fillRect(tx,base-2,1,4);
  }
  // foreground ground + platforms
  x=FG.getContext('2d');
  x.fillStyle='#211a42';x.fillRect(0,GROUND,WORLD,H-GROUND);
  for(let i=0;i<120;i++){const sx=r()*WORLD|0,sy=GROUND+5+(r()*(H-GROUND-5)|0),w=2+(r()*5|0);x.fillStyle=r()<.5?'#2c2456':'#352c66';x.fillRect(sx,sy,w,2);x.fillStyle='#181232';x.fillRect(sx,sy+2,w,1)}
  x.fillStyle='#3d8f86';x.fillRect(0,GROUND,WORLD,3);
  x.fillStyle='#2a6a68';x.fillRect(0,GROUND+3,WORLD,1);
  for(let p=0;p<WORLD;p++){if((p*7)%5<2){x.fillStyle='#78d8bf';x.fillRect(p,GROUND,1,1)}if(r()<.28){const bh2=1+(r()*3|0);x.fillStyle=r()<.5?'#3d8f86':'#5cb8a2';x.fillRect(p,GROUND-bh2,1,bh2)}if(r()<.02){x.fillStyle='#ff9bc0';x.fillRect(p,GROUND-3,1,1);x.fillStyle='#fff';x.fillRect(p+1,GROUND-3,1,1)}}
})();
const PLATS=[{x:104,y:114,w:64},{x:284,y:94,w:76},{x:472,y:114,w:64}];
(function plats(){
  const x=FG.getContext('2d'),r=mulberry32(5);
  for(const p of PLATS){
    for(let yy=0;yy<9;yy++){const ins=yy<5?0:(yy-4)*2;x.fillStyle=yy===8?'#1d1740':'#3a3270';x.fillRect(p.x+ins,p.y+yy,p.w-ins*2,1)}
    x.fillStyle='#2a2352';for(let bx=p.x+6;bx<p.x+p.w-4;bx+=10){x.fillRect(bx,p.y+3,1,4)}x.fillRect(p.x+2,p.y+5,p.w-4,1);
    x.fillStyle='#3d8f86';x.fillRect(p.x-1,p.y-1,p.w+2,3);x.fillStyle='#78d8bf';for(let q=0;q<p.w;q+=2)x.fillRect(p.x+q,p.y-1,1,1);
    for(let q=2;q<p.w-2;q+=3+(r()*4|0)){const l=2+(r()*7|0);x.fillStyle='#2f7a70';x.fillRect(p.x+q,p.y+2,1,l);if(r()<.4){x.fillStyle='#ff9bc0';x.fillRect(p.x+q,p.y+2+l,1,1)}}
  }
})();

/* ---------- sprite buffers (outline pass) ---------- */
const SB=mk(64,64),sb=SB.getContext('2d'),TB=mk(64,64),tb=TB.getContext('2d');
function render(fn,face){sb.clearRect(0,0,64,64);sb.save();sb.translate(32,56);if(face<0)sb.scale(-1,1);c=sb;fn();sb.restore();c=g}
function tint(col){tb.globalCompositeOperation='source-over';tb.clearRect(0,0,64,64);tb.drawImage(SB,0,0);tb.globalCompositeOperation='source-in';tb.fillStyle=col;tb.fillRect(0,0,64,64);tb.globalCompositeOperation='source-over'}
function blit(fn,x,y,face,flash){
  render(fn,face);const X=Math.round(x-cam)-32+sx,Y=Math.round(y)-56+sy;
  tint(OL);g.drawImage(TB,X+1,Y);g.drawImage(TB,X-1,Y);g.drawImage(TB,X,Y+1);g.drawImage(TB,X,Y-1);
  if(flash){tint('#ffffff');g.drawImage(TB,X,Y)}else g.drawImage(SB,X,Y);
}

/* ---------- hero art ---------- */
function swordAngle(h){
  if(h.state==='attack'){const q=clamp((h.atkDur-h.atkT)/(h.atkDur*.55),0,1),e=1-Math.pow(1-q,3);const A=SW[h.combo];return A[0]+(A[1]-A[0])*e}
  if(h.state==='skill')return -.15;
  if(h.state==='dash')return 2.75;
  if(h.state==='hurt')return 2.3;
  if(h.state==='jump')return -.6;
  if(h.state==='fall')return .2;
  return .75;
}
const SW=[[-2.1,1.15],[1.25,-1.45],[-2.7,1.7]];
function heroArt(h){return()=>{
  const s=h.state,t=h.anim;let bob=0,lo=0,hs=0,lift=0;
  if(s==='run'){const f=Math.floor(t*12)%4;lo=[2,0,-2,0][f];bob=f%2?-1:0;hs=[0,1,2,1][f]}
  else if(s==='idle'){bob=Math.floor(t*2.4)%2?-1:0;hs=bob?1:0}
  else if(s==='jump'){lo=1;lift=1;hs=-1}else if(s==='fall'){lo=-1;hs=3}
  else if(s==='dash'){lo=3;hs=4}else if(s==='attack'||s==='skill'){lo=2;hs=2}else if(s==='hurt'){lo=-1;hs=3}
  const y=bob;
  // long hair behind
  R(-9-hs,-25+y,5,11,C.hair);R(-10-hs,-17+y,4,5,C.hairS);R(-9-hs,-13+y,2,3,C.hairD);R(-6-hs,-26+y,3,2,C.hairS);
  R(-11-hs,-24+y,2,2,C.rib);R(-12-hs,-22+y,1,3,C.rib);
  // legs
  R(-3-lo,-7-lift,2,6,C.coatS);R(-4-lo,-2-lift,3,2,C.boot);
  R(1+lo,-7-lift,2,6,'#e7e1f6');R(1+lo,-2-lift,3,2,C.boot);R(3+lo,-2-lift,1,1,C.gold);
  // coat
  R(-5,-10+y,10,3,C.coat);R(-6-(hs>2?1:0),-9+y,2,3,C.coatS);R(-5,-8+y,10,1,C.coatS);
  R(-5,-15+y,2,5,C.coatS);
  R(-4,-16+y,8,7,C.coat);R(-1,-16+y,3,6,C.white);R(-4,-11+y,8,1,C.gold);R(0,-11+y,1,1,'#fff6c8');
  R(-3,-16+y,6,1,C.white);R(1,-15+y,2,2,C.rib);
  // head
  R(-5,-26+y,10,10,C.skin);R(-5,-17+y,10,1,C.skinS);
  R(-6,-28+y,12,4,C.hair);R(-6,-24+y,2,7,C.hair);R(-7,-27+y,2,4,C.hairS);R(-4,-29+y,7,1,C.hair);R(-2,-29+y,3,1,'#ffffff');
  R(-1,-24+y,5,2,C.hair);R(3,-24+y,3,5,C.hair);R(4,-20+y,1,2,C.hairS);R(0,-22+y,1,1,C.hair);R(-4,-24+y,1,2,C.hairS);
  R(-7,-28+y,3,2,C.rib);
  // face
  const blink=(s==='idle'||s==='run')&&(t%3.2)>3.05;

  if(waveState==='fight'){
    if(spawnQ.length){spawnT-=dt;if(spawnT<=0&&enemies.length<5+Math.floor(wave/2)){spawn(spawnQ.shift());spawnT=Math.max(.45,1.25-wave*.05)}}
    else if(!enemies.length){waveState='clear';waveT=2.2;say('CLEAR','HP +15%');hero.hp=Math.min(hero.maxHp,hero.hp+Math.round(hero.maxHp*.15))}
  }else if(waveState==='clear'){waveT-=dt;if(waveT<=0)startWave()}
}
function update(dt){
  now+=dt;
  for(const s of stars)s.p+=dt;
  if(state==='title'){hero.anim+=dt;updMisc(dt);return}
  if(hitstop>0){hitstop-=dt;updMisc(dt*.2);keep=true;return}
  updHero(dt);updEnemies(dt);updMisc(dt);updWaves(dt);
  if(hero.dead&&state==='play'){deathT-=dt;if(deathT<=0){state='over';document.getElementById('sWave').textContent=wave;document.getElementById('sLv').textContent=hero.lv;document.getElementById('sKo').textContent=kills;overEl.hidden=false}}
  const tc=clamp(hero.x-W/2+hero.face*24,0,WORLD-W);cam+=(tc-cam)*Math.min(1,dt*5);
}

/* ---------- draw ---------- */
function text(s,x,y,col,align='left',font=PF){g.font=font;g.textAlign=align;g.textBaseline='top';g.fillStyle=OL;g.fillText(s,x+1,y+1);g.fillStyle=col;g.fillText(s,x,y)}
function bar(x,y,w,h,f,col,hi,lag){R(x-1,y-1,w+2,h+2,OL);R(x,y,w,h,'#2a2150');if(lag!=null)R(x,y,Math.round(w*clamp(lag,0,1)),h,'#ffffff');const fw=Math.round(w*clamp(f,0,1));R(x,y,fw,h,col);if(h>2)R(x,y,fw,1,hi)}
function drawArc(cx,cy,face,a0,a1,r0,r1,cin,cout,alpha){
  g.globalAlpha=alpha;const st=a1>a0?.05:-.05;
  for(let a=a0;st>0?a<=a1:a>=a1;a+=st)for(let r=r0;r<=r1;r++){g.fillStyle=r>=r1-1?cout:cin;g.fillRect(Math.round(cx+face*Math.cos(a)*r),Math.round(cy+Math.sin(a)*r),1,1)}
  g.globalAlpha=1;
}
function draw(){
  c=g;
  if(shake>0){sx=Math.round((rnd()-.5)*shake);sy=Math.round((rnd()-.5)*shake);shake=Math.max(0,shake-0.5)}else{sx=sy=0}
  g.drawImage(SKY,0,0);
  for(const s of stars){if(Math.sin(s.p*2.5)>.4){R(s.x-1,s.y,3,1,'rgba(255,255,255,.5)');R(s.x,s.y-1,1,3,'rgba(255,255,255,.5)');R(s.x,s.y,1,1,'#fff')}}
  g.drawImage(FAR,Math.round(-cam*.2),0);
  g.drawImage(MID,Math.round(-cam*.5),0);
  g.drawImage(FG,Math.round(-cam)+sx,sy);
  // drops
  for(const d of drops){const X=Math.round(d.x-cam)+sx,Y=Math.round(d.y+Math.sin(d.t*4)*1.5)+sy;if(d.t>9&&Math.floor(d.t*8)%2)continue;
    const s=d.big?2:1;c=g;R(X-3*s,Y-2*s,2*s,2*s,'#ff6b9a');R(X+1*s,Y-2*s,2*s,2*s,'#ff6b9a');R(X-3*s,Y,6*s,2*s,'#ff6b9a');R(X-2*s,Y+2*s,4*s,1*s,'#ff6b9a');R(X-1*s,Y+3*s,2*s,1*s,'#ff6b9a');R(X-2*s,Y-1*s,1*s,1*s,'#ffffff')}
  // enemies
  for(const e of enemies){
    const art=e.type==='slime'?slimeArt(e):e.type==='wisp'?wispArt(e):knightArt(e);
    if(e.type!=='wisp'){g.globalAlpha=.35;R(Math.round(e.x-cam)-e.w+sx,GROUND+sy,e.w*2,2,OL);g.globalAlpha=1}
    blit(art,e.x,e.y,e.face,e.flash>0);
    if(e.type==='knight'&&e.ai==='wind')text('!',Math.round(e.x-cam)+sx,e.y-48+sy,'#ff4d6d','center','10px Silkscreen, monospace');
    if(e.type!=='knight'&&e.hp<e.max){const X=Math.round(e.x-cam)-7+sx,Y=Math.round(e.y-e.h)-5+sy;bar(X,Y,14,1,e.hp/e.max,'#ff6b9a','#ff6b9a')}
  }
  // ghosts
  for(const gh of ghosts){render(heroArt(gh.snap),gh.face);tint('#5fdcff');g.globalAlpha=gh.life*2;g.drawImage(TB,Math.round(gh.x-cam)-32+sx,Math.round(gh.y)-56+sy);g.globalAlpha=1}
  // hero
  const h=hero;
  if(!h.dead){
    g.globalAlpha=.35;R(Math.round(h.x-cam)-5+sx,(h.onGround?h.y:GROUND)+sy,10,2,OL);g.globalAlpha=1;
    if(!(h.inv>0&&h.dashT<=0&&Math.floor(now*16)%2))blit(heroArt(h),h.x,h.y,h.face,false);
    if(h.state==='attack'){
      const A=SW[h.combo],q=clamp((h.atkDur-h.atkT)/(h.atkDur*.55),0,1),e=1-Math.pow(1-q,3),cur=A[0]+(A[1]-A[0])*e;
      const fade=clamp(h.atkT/h.atkDur*1.6,0,1);const tail=A[1]>A[0]?Math.max(A[0],cur-1.7):Math.min(A[0],cur+1.7);
      const big=h.combo===2;drawArc(Math.round(h.x-cam)+sx+h.face,h.y-14+sy,h.face,tail,cur,big?15:12,big?21:17,'#e4f7ff','#7fe3ff',.85*fade);
    }
  }
  // shots
  for(const s of shots){const X=Math.round(s.x-cam)+sx,Y=Math.round(s.y)+sy,f=Math.sign(s.vx);
    for(let i=-9;i<=9;i++){const o=Math.round(5*Math.sqrt(1-(i/9.5)**2));R(X+f*o,Y+i,f>0?2:-2,1,'#ffffff');R(X+f*(o-2),Y+i,f>0?2:-2,1,'#7fe3ff');g.globalAlpha=.4;R(X+f*(o-5),Y+i,f>0?3:-3,1,'#5fdcff');g.globalAlpha=1}}
  // particles
  for(const p of parts){g.globalAlpha=clamp(p.life/p.max*1.5,0,1);R(Math.round(p.x-cam)+sx,Math.round(p.y)+sy,p.sz,p.sz,p.col)}g.globalAlpha=1;
  // petals
  for(const p of petals){R(Math.round(p.x),Math.round(p.y),Math.sin(p.s*3)>0?2:1,1,p.c)}
  // numbers
  for(const n of nums){g.globalAlpha=clamp(n.t*3,0,1);text(String(n.v),Math.round(n.x-cam)+sx,Math.round(n.y)+sy,n.col,'center',n.big?'16px Silkscreen, monospace':PF)}g.globalAlpha=1;
  if(state==='title')return;
  // HUD
  text('LV '+h.lv,8,6,'#ffe3a3');
  bar(44,8,84,5,h.hp/h.maxHp,'#ff5d8a','#ff9bb8',h.hpLag/h.maxHp);
  text(String(Math.ceil(h.hp)),132,5,'#ffffff');
  bar(44,16,64,3,h.mp/h.maxMp,h.mp>=25?'#59b8ff':'#3a5b9a','#a9dcff');
  bar(44,22,64,1,h.exp/h.next,'#ffe08a','#ffe08a');
  text('WAVE '+Math.max(1,wave),W-8,6,'#ece8ff','right');
  text('KO '+kills,W-8,16,'#9790c4','right');
  const boss=enemies.find(e=>e.type==='knight');
  if(boss){text('SHADOW KNIGHT',W/2,H-18,'#ff9bb8','center');bar(W/2-60,H-8,120,3,boss.hp/boss.max,'#ff4d6d','#ff9bb8')}
  if(banner){const t=banner.t,a=clamp(Math.min(t*3,(1.7-t)*6),0,1);g.globalAlpha=a;const yy=58+Math.round((1-a)*-6);text(banner.text,W/2,yy,'#ffe3a3','center','16px Silkscreen, monospace');if(banner.sub)text(banner.sub,W/2,yy+20,'#7fe3ff','center');g.globalAlpha=1}
}

/* ---------- loop ---------- */
let last=performance.now(),keep=false;
function frameLoop(t){const dt=Math.min(1/30,(t-last)/1000);last=t;keep=false;update(dt);if(!keep)pressed={};draw();requestAnimationFrame(frameLoop)}
(document.fonts?document.fonts.load(PF):Promise.resolve()).catch(()=>{}).finally(()=>requestAnimationFrame(frameLoop));
})();
</script>
</body>
</html>
